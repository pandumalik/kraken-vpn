[package]
name = "kraken-vpn"
version = "2.0.0"
edition = "2021"
description = "Pure Rust multi-protocol desktop VPN manager for OpenVPN and OpenConnect"
authors = ["Pandu Malik", "Kraken VPN Contributors"]
license = "LicenseRef-KrakenVPN-NonCommercial"

[lib]
name = "kraken_vpn"
path = "src/lib.rs"

[[bin]]
name = "kraken-vpn"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
rfd = "0.15"
sysinfo = { version = "0.32", default-features = false, features = ["network"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
directories = "5.0"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
regex = "1.11"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true