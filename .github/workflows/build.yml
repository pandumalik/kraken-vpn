name: Build & Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release tagged v<Cargo.toml version>"
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify, Build & Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Could not find package version in Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Git tag '${{ github.ref_name }}' does not match Cargo.toml version '$tag'."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=KrakenVPN-Windows-$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved release version=$version tag=$tag"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build Windows release executable
        run: cargo build --release --locked

      - name: Smoke-test release executable (--version and --check)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = ".\target\release\kraken-vpn.exe"
          $expectedVersion = "${{ steps.meta.outputs.version }}"

          $versionOut = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "--version exited with $LASTEXITCODE" }
          Write-Host "Version output: $versionOut"
          if ($versionOut -ne "kraken-vpn $expectedVersion") {
            throw "Expected 'kraken-vpn $expectedVersion', got '$versionOut'"
          }

          $checkOut = (& $exe --check | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "--check exited with $LASTEXITCODE" }
          Write-Host $checkOut
          if ($checkOut -notmatch 'Self-check complete:\s*OK') {
            throw "Self-check output did not report OK"
          }

      - name: Build Windows Installer (Inno Setup 6)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }
          .\installer\build-installer.ps1 -SkipBuild

      - name: Generate installer SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.meta.outputs.version }}"
          $outDir = "release-artifacts"
          $setupName = "KrakenVPN-Setup-$version-windows-x86_64.exe"
          $setupPath = Join-Path $outDir $setupName

          if (-not (Test-Path $setupPath)) {
            throw "Expected installer missing at $setupPath"
          }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $setupPath).Hash.ToLowerInvariant()
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path $outDir) "SHA256SUMS.txt"), "$hash  $setupName`n", $utf8NoBom)

          Write-Host "Packaged installer artifact:"
          Get-ChildItem $outDir | Format-Table Name, Length -AutoSize
          Get-Content (Join-Path $outDir "SHA256SUMS.txt")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release-artifacts/*
          retention-days: 30
          if-no-files-found: error

  audit:
    name: Security Audit (Secrets & Cargo Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Rust dependencies (cargo-audit)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish GitHub Release
    needs: [verify-and-build, audit]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-and-build.outputs.artifact_name }}
          path: release-artifacts

      - name: Verify SHA256 checksums before release
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-and-build.outputs.tag }}
          name: Kraken VPN ${{ needs.verify-and-build.outputs.tag }}
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: |
            release-artifacts/KrakenVPN-Setup-*.exe
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
